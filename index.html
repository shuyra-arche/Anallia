<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Anallia — 沿圆周阅读，在斜向导轨间移动；体验长文、星轨与流场。"
    />
    <title>Anallia · 几何阅读演示</title>
  </head>
  <body>
    <div id="scene">
      <svg
        id="world"
        xmlns="http://www.w3.org/2000/svg"
        role="group"
        aria-label="Shuyra：几何阅读、流场与波动扰动"
        draggable="false"
      >
        <defs>
          <!-- 变换曲线扫过区域的精确拓扑裁剪路径 (支持 evenodd 内外翻转) -->
          <clipPath id="hubPortal" clipPathUnits="userSpaceOnUse">
            <path
              id="portalBoundaryPath"
              clip-rule="evenodd"
              fill-rule="evenodd"
              d="M0,0Z"
            />
          </clipPath>
        </defs>

        <rect
          id="baseBg"
          x="0"
          y="0"
          width="100%"
          height="100%"
          fill="#F5F6F2"
        />
        <!-- 随变换线条扫过区域实时变色的合成视口 -->
        <g id="portalViewport" clip-path="url(#hubPortal)" visibility="hidden">
          <rect
            id="portalBg"
            x="0"
            y="0"
            width="100%"
            height="100%"
            fill="#10191B"
          />
        </g>

        <!-- 世界坐标中的流场背景 -->
        <g id="gDecorations"></g>

        <g id="gGeometry"></g>
        <path id="portalStroke" d="" />
        <path id="portalEchoStroke" d="" />
        <g id="gLabels"></g>
      </svg>

      <div id="reading"></div>

      <!-- Shuyra Loading V24 完整几何动效层 -->
      <div
        id="loadingOverlay"
        aria-label="Shuyra 正在加载 (点击任意处结束并离场)"
      >
        <svg
          id="loadingFigure"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 440 440"
          role="img"
        >
          <defs>
            <radialGradient
              id="soft-fade"
              gradientUnits="userSpaceOnUse"
              cx="220"
              cy="220"
              r="196"
            >
              <stop offset="0" stop-color="white" stop-opacity="1" />
              <stop offset=".80" stop-color="white" stop-opacity="1" />
              <stop offset=".90" stop-color="white" stop-opacity=".92" />
              <stop offset="1" stop-color="black" stop-opacity="0" />
            </radialGradient>
            <mask
              id="soft-mask"
              maskUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="440"
              height="440"
            >
              <rect x="0" y="0" width="440" height="440" fill="black" />
              <circle cx="220" cy="220" r="196" fill="url(#soft-fade)" />
            </mask>
            <linearGradient
              id="ink-gradient"
              gradientUnits="userSpaceOnUse"
              x1="70"
              y1="80"
              x2="370"
              y2="350"
            >
              <stop
                offset="0"
                stop-color="var(--loader-ink)"
                stop-opacity=".88"
              />
              <stop
                offset=".42"
                stop-color="var(--loader-ink)"
                stop-opacity="1"
              />
              <stop
                offset=".78"
                stop-color="var(--loader-ink)"
                stop-opacity=".965"
              />
              <stop
                offset="1"
                stop-color="var(--loader-ink)"
                stop-opacity=".90"
              />
            </linearGradient>
            <linearGradient
              id="silver-gradient"
              gradientUnits="userSpaceOnUse"
              x1="85"
              y1="100"
              x2="366"
              y2="344"
            >
              <stop
                offset="0"
                stop-color="var(--loader-arc)"
                stop-opacity=".72"
              />
              <stop
                offset=".28"
                stop-color="var(--loader-arc-light)"
                stop-opacity=".88"
              />
              <stop
                offset=".52"
                stop-color="var(--loader-arc-light)"
                stop-opacity=".97"
              />
              <stop
                offset=".74"
                stop-color="var(--loader-arc)"
                stop-opacity=".90"
              />
              <stop
                offset="1"
                stop-color="var(--loader-arc)"
                stop-opacity=".76"
              />
            </linearGradient>
          </defs>
          <g id="loadingGeometry" mask="url(#soft-mask)">
            <path class="mark" id="mark0" />
            <path class="mark" id="mark1" />
            <path class="arc-fine" id="arc-fine0" />
            <path class="arc-fine" id="arc-fine1" />
            <path class="core" id="circle0" />
            <path class="core" id="circle1" />
            <path class="core" id="circle2" />
            <g id="straight">
              <path class="core" id="straight0" />
              <path class="core" id="straight1" />
              <path class="core" id="straight2" />
            </g>
            <path class="pen-tip" id="tip0" />
            <path class="pen-tip" id="tip1" />
            <path class="pen-tip" id="tip2" />
          </g>
        </svg>
      </div>

      <!-- 唯一保留的左下角说明文字 -->
      <div id="descBar">
        曲线扫掠区域实时变色 · 单文本块缩放+高斯模糊沉浮（可在 ⚙
        设置枢调节显现范围） · 背景含水波涟漪圆枢与牛顿摆弦震动线枢
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
